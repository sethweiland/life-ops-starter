name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  dependencies-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip_audit --require-hashes -r requirements.txt
      - run: python -m pip_audit --require-hashes -r requirements-dev.txt
      - run: python -m bandit -r src web scripts -ll
      - name: Install verified secret scanner
        run: |
          curl --fail --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/life-ops-scanner
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/life-ops-scanner gitleaks
      - name: Scan new repository history and exact export
        run: |
          /tmp/life-ops-scanner/gitleaks git . --redact --no-banner
          python scripts/export_public.py --output dist-public/security-candidate
          /tmp/life-ops-scanner/gitleaks dir dist-public/security-candidate --redact --no-banner
